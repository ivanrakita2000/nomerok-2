(function(){
  function showBootError(title, detail){
    try{
      document.body.innerHTML = '<div style="min-height:100vh;background:#080808;color:#fff;padding:28px 18px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><h2 style="margin:0 0 12px">Номерок не запустился</h2><div style="color:#ff6b7a;font-weight:800;margin-bottom:10px">'+String(title).replace(/[&<>]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[x]})+'</div><pre style="white-space:pre-wrap;color:#aaa;font-size:12px">'+String(detail||'').replace(/[&<>]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[x]})+'</pre><p style="color:#777;font-size:12px">Сделай скрин этого экрана и отправь его мне.</p></div>';
    }catch(e){}
  }
  window.__nomerokBootError=showBootError;
  window.addEventListener('error',function(e){showBootError('JavaScript error', (e.message||'')+'\nСтрока: '+(e.lineno||'?')+'\nФайл: '+(e.filename||'?'));});
  window.addEventListener('unhandledrejection',function(e){showBootError('Необработанная ошибка', e.reason&&e.reason.stack?e.reason.stack:String(e.reason||''));});
})();
</script>

function onlineLocalId(){
  let id='';
  try{id=localStorage.getItem('nomerok_online_id')||''}catch(e){}
  if(!id){
    if(window.crypto&&crypto.randomUUID)id=crypto.randomUUID();
    else{let a=new Uint32Array(4);crypto.getRandomValues(a);id=Array.from(a).map(x=>x.toString(36)).join('').slice(0,20)}
    try{localStorage.setItem('nomerok_online_id',id)}catch(e){}
  }
  return id;
}

function globalKey(p){
  if(!p)return '';
  if(p.specialId)return 'SPECIAL:'+p.specialId;
  return [p.letters&&p.letters.join('')||'',p.digits&&p.digits.join('')||'',String(p.region||'')].join('|').toUpperCase();
}
function globalFetch(path,opts){
  opts=opts||{}; let ctl=window.AbortController?new AbortController():null;
  if(ctl)opts.signal=ctl.signal;
  opts.headers=Object.assign({'apikey':GLOBAL_CONFIG.key,'Authorization':'Bearer '+GLOBAL_CONFIG.key,'Content-Type':'application/json'},opts.headers||{});
  let timer=setTimeout(function(){if(ctl)ctl.abort()},GLOBAL_CONFIG.timeout);
  return fetch(GLOBAL_CONFIG.url+path,opts).finally(function(){clearTimeout(timer)});
}
async function claimGlobalPlate(p){
  let key=globalKey(p); if(!key)throw new Error('Не удалось определить номер.');

  let r;
  try{r=await globalFetch('/rest/v1/global_plates',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)})}
  catch(e){
    /* Если внешний реестр временно недоступен, не блокируем обычную игру.

    GLOBAL_OFFLINE=true;

    if(S.globalLocalClaims[key])return false;
    S.globalLocalClaims[key]=true;
    save();

    // Номер уже занят в общем реестре — сразу пробуем другую комбинацию.
    // Не делаем дополнительный GET-запрос, чтобы iPhone не зависал на ожидании сети.
    return false;
  }
  if(!r.ok){let txt='';try{txt=await r.text()}catch(e){};throw new Error('Глобальный реестр отклонил номер ('+r.status+').')}
  return true;
}

function peerOptions(){return {host:ONLINE_CONFIG.host,port:ONLINE_CONFIG.port,path:ONLINE_CONFIG.path,secure:ONLINE_CONFIG.secure,debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}}}
let PEER_LOADING=null;
function loadPeerJS(){
  if(typeof Peer!=='undefined')return Promise.resolve(true);
  if(PEER_LOADING)return PEER_LOADING;
  PEER_LOADING=new Promise(function(resolve,reject){
    let done=false;
    function finish(ok,err){if(done)return;done=true;if(ok)resolve(true);else reject(err||new Error('Не удалось загрузить модуль онлайн-игры.'))}
    let urls=[
      'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'
    ];
    let i=0;
    function next(){
      if(typeof Peer!=='undefined')return finish(true);
      if(i>=urls.length)return finish(false,new Error('Модуль онлайн-игры недоступен. Обычная игра работает без него.'));
      let sc=document.createElement('script');sc.src=urls[i++];sc.async=true;
      let timer=setTimeout(function(){try{sc.remove()}catch(e){};next()},7000);
      sc.onload=function(){clearTimeout(timer);if(typeof Peer!=='undefined')finish(true);else next()};
      sc.onerror=function(){clearTimeout(timer);try{sc.remove()}catch(e){};next()};
      document.head.appendChild(sc);
    }
    next();
  });
  return PEER_LOADING;
}
function peerCreate(id){
  if(typeof Peer==='undefined')throw new Error('Модуль онлайн-игры ещё не загрузился. Открой «Играть вместе» ещё раз.');
  return id?new Peer(id,peerOptions()):new Peer(peerOptions());
}
function waitPeerOpen(peer,timeout){return new Promise(function(resolve,reject){let done=false,t=setTimeout(function(){if(done)return;done=true;try{peer.destroy()}catch(e){}reject(new Error('Сервер комнат не ответил за '+Math.round(timeout/1000)+' секунд.'))},timeout);peer.once('open',function(id){if(done)return;done=true;clearTimeout(t);resolve(id)});peer.once('error',function(e){if(done)return;done=true;clearTimeout(t);try{peer.destroy()}catch(x){}reject(e)})})}
function peerError(e){
  let t=e&&e.type||'';
  if(t==='unavailable-id')return 'Этот код комнаты уже занят. Попробуй создать комнату ещё раз.';
  if(t==='peer-unavailable')return 'Комната не найдена или хозяин вышел.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return 'Сервер комнат недоступен. Проверь интернет и попробуй ещё раз.';
  if(t==='browser-incompatible')return 'Этот браузер не поддерживает P2P-соединение.';
  return e&&e.message?e.message:String(e);
}
function onlineState(){return {players:ONLINE.players,events:ONLINE.events,chat:ONLINE.chat||[],market:ONLINE.market||[],uniqueClaims:ONLINE.uniqueClaims||{},claimedKeys:ONLINE.claimedKeys||{}}}
function safeSend(conn,msg){if(!conn)return false;try{if(conn.open){conn.send(msg);return true}}catch(e){}return false}
function broadcastState(){
  if(!ONLINE.host)return;
  let msg={type:'state',state:onlineState()};
  Object.keys(ONLINE.conns).forEach(function(k){safeSend(ONLINE.conns[k],msg)});
  renderOnline();
}

function addChat(name,text){
  text=String(text||'').trim().slice(0,220);if(!text)return;
  ONLINE.chat=ONLINE.chat||[];ONLINE.chat.push({name:String(name||'Игрок').slice(0,18),text:text,created_at:Date.now()});ONLINE.chat=ONLINE.chat.slice(-60);
}
function setupHostConnection(conn){
  ONLINE.conns[conn.peer]=conn;
  conn.on('open',function(){safeSend(conn,{type:'state',state:onlineState()})});
  conn.on('data',function(msg){
    if(!msg||typeof msg!=='object')return;
    if(msg.type==='join'){
      let name=String(msg.name||'Игрок').trim().slice(0,18)||'Игрок';
      if(!ONLINE.players.find(function(x){return x.user_id===conn.peer})){
        if(ONLINE.players.length>=6){safeSend(conn,{type:'full'});try{conn.close()}catch(e){};return}
        ONLINE.players.push({user_id:conn.peer,local_id:String(msg.local_id||''),name:name,spins:0,best_value:0,best_plate:null,last_plate:null,collection_value:0});
        addChat('Система',name+' присоединился к комнате 👋');
      }
      safeSend(conn,{type:'state',state:onlineState()});
      broadcastState();
    }else if(msg.type==='drop'){
      let pl=ONLINE.players.find(function(x){return x.user_id===conn.peer});
      if(!pl||!msg.plate)return;
      let p=msg.plate;
      let pkey=globalKey(p);
      if(pkey&&ONLINE.claimedKeys[pkey]){safeSend(conn,{type:'plate-rejected',plate_key:pkey});return}
      if(pkey)ONLINE.claimedKeys[pkey]=conn.peer;
      if(p.specialId){if(ONLINE.uniqueClaims[p.specialId]){safeSend(conn,{type:'special-rejected',specialId:p.specialId});return}ONLINE.uniqueClaims[p.specialId]=conn.peer;}
      pl.spins=Number(pl.spins||0)+1;
      pl.collection_value=Number(pl.collection_value||0)+Number(p.value||0);
      pl.last_plate=onlinePlate(p);
      if(Number(p.value||0)>Number(pl.best_value||0)){pl.best_value=Number(p.value||0);pl.best_plate=onlinePlate(p)}
      addEvent({name:pl.name,drop:p});
      broadcastState();
    }else if(msg.type==='chat'){
      let pl=ONLINE.players.find(function(x){return x.user_id===conn.peer});
      let name=pl?pl.name:'Игрок';
      addChat(name,msg.text);broadcastState();
    }else if(msg.type==='market-list'){let it=msg.item;if(it&&it.seller_id===conn.peer){ONLINE.market.push(it);broadcastState()}}else if(msg.type==='market-buy'){let it=ONLINE.market.find(function(x){return x.id===msg.listing_id});if(it&&msg.buyer_id===conn.peer)completePlayerSale(it,msg.buyer_id)}else if(msg.type==='market-cancel'){let it=ONLINE.market.find(function(x){return x.id===msg.listing_id});if(it&&it.seller_id===conn.peer){ONLINE.market=ONLINE.market.filter(function(x){return x.id!==it.id});broadcastState()}}else if(msg.type==='leave'){
      removeHostPlayer(conn.peer);
    }
  });
  conn.on('close',function(){removeHostPlayer(conn.peer)});
  conn.on('error',function(){});
}
function removeHostPlayer(id){
  let pl=ONLINE.players.find(function(x){return x.user_id===id});
  if(pl)addChat('Система',pl.name+' вышел из комнаты');
  delete ONLINE.conns[id];
  ONLINE.players=ONLINE.players.filter(function(x){return x.user_id!==id});
  broadcastState();
}
async function createRoom(name){
  name=String(name||'').trim().slice(0,18)||'Игрок';onlineSaveName(name);
  if(ONLINE.peer)await leaveRoom();
  let tries=0,last=null;
  while(tries<5){
    tries++;let code=onlineCode(),peer=peerCreate(code);
    try{
      await waitPeerOpen(peer,9000);
      ONLINE.peer=peer;ONLINE.host=true;ONLINE.room={code:code};ONLINE.player={user_id:peer.id,local_id:onlineLocalId(),name:name,spins:0,best_value:0,best_plate:null,last_plate:null,collection_value:0};ONLINE.players=[ONLINE.player];ONLINE.events=[];ONLINE.market=[];ONLINE.uniqueClaims={};ONLINE.claimedKeys={};ONLINE.spinning=false;ONLINE.chat=[{name:'Система',text:'Комната создана. Можно играть и общаться 👋',created_at:Date.now()}];ONLINE.conns={};
      peer.on('connection',setupHostConnection);
      peer.on('disconnected',function(){try{peer.reconnect()}catch(e){}});
      peer.on('error',function(e){if(e&&e.type!=='unavailable-id')toast('Онлайн: '+peerError(e))});
      renderOnline();return;
    }catch(e){last=e;if(e&&e.type==='unavailable-id')continue;throw new Error('Не удалось создать комнату: '+peerError(e))}
  }
  throw new Error('Не удалось создать свободный код комнаты: '+peerError(last));
}
async function joinRoom(code,name){
  code=String(code||'').trim().toUpperCase();name=String(name||'').trim().slice(0,18)||'Игрок';
  if(code.length!==6)throw new Error('Код комнаты должен состоять из 6 символов.');
  onlineSaveName(name);if(ONLINE.peer)await leaveRoom();
  let peer=peerCreate();
  try{
    await waitPeerOpen(peer,9000);
    ONLINE.peer=peer;ONLINE.host=false;ONLINE.room={code:code};ONLINE.players=[];ONLINE.events=[];ONLINE.market=[];ONLINE.uniqueClaims={};ONLINE.claimedKeys={};ONLINE.spinning=false;ONLINE.chat=[];
    let conn=peer.connect(code,{reliable:true,metadata:{name:name,local_id:onlineLocalId()}});ONLINE.hostConn=conn;
    await new Promise(function(resolve,reject){
      let done=false,t=setTimeout(function(){if(done)return;done=true;try{conn.close()}catch(e){};reject(new Error('Хозяин комнаты не ответил. Проверь код.'))},9000);
      conn.on('open',function(){if(done)return;done=true;clearTimeout(t);safeSend(conn,{type:'join',name:name,local_id:onlineLocalId()});resolve()});
      conn.on('error',function(e){if(done)return;done=true;clearTimeout(t);reject(new Error(peerError(e)))});
      conn.on('data',function(msg){
        if(!msg||typeof msg!=='object')return;

async function onlineSpin(){
  if(!ONLINE.room||!ONLINE.player)return;
  if(ONLINE.spinning){toast('Прокрутка уже идёт');return}
  if(S.money<COST){toast('Недостаточно виртуальных ₽');return}
  ONLINE.spinning=true;
  let box=document.getElementById('onlineRolling');
  if(!box){renderOnline();box=document.getElementById('onlineRolling');}
  S.money-=COST;S.stats.spent+=COST;save();
  let n=0,total=20,finalPlate=null,done=false;
  let timer=null;
  function draw(){
    let q=generate();
    if(box)box.innerHTML=plate(q)+info(q);
    n++;
    if(n<total){timer=setTimeout(draw,55+n*5);return;}
    finish();
  }
  async function finish(){
    if(done)return;done=true;if(timer)clearTimeout(timer);
    try{
      let p=null,claimed=false;
      for(let attempt=0;attempt<20&&!claimed;attempt++){
        p=generate();
        let key=globalKey(p);
        if(ONLINE.claimedKeys&&ONLINE.claimedKeys[key])continue;
        claimed=await claimGlobalPlate(p);
      }
      if(!claimed){
        S.money+=COST;S.stats.spent=Math.max(0,S.stats.spent-COST);save();renderOnline();ONLINE.spinning=false;toast('Не удалось получить свободный номер. ₽ возвращены.');return;
      }
      finalPlate=p;
      S.last=p;S.stats.spins++;S.stats.bestValue=Math.max(S.stats.bestValue,p.value);
      if(p.value===S.stats.bestValue){S.stats.bestText=p.text+' '+p.region;S.stats.bestRarity=p.rarity}
      if(!S.regions.includes(p.region))S.regions.push(p.region);
      xp(p.rarity==='Уникальная'?45:p.rarity==='Легендарная'?32:p.rarity==='Эпическая'?20:p.rarity==='Редкая'?12:5);
      if(S.luckBoostSpins>0){S.luckBoostSpins--;if(!S.luckBoostSpins)S.luckBoost=0}
      S.plates.unshift(p);S.plates=S.plates.slice(0,S.storageMax);
      if(p.specialId)S.specialClaimed[p.specialId]=true;
      if(ONLINE.host)ONLINE.claimedKeys[globalKey(p)]=ONLINE.peer.id;
      save();
      await syncResult(p);
      render();renderOnline();
      ONLINE.spinning=false;if(isSpecial(p))showUniqueReveal(p,function(){renderOnline()});else toast('Номер выбит: '+p.text);
    }catch(err){

      ONLINE.spinning=false;toast(err&&err.message?err.message:'Ошибка онлайн-прокрутки. ₽ возвращены.');
    }
  }
  draw();
}

function findings(letters,digits,region){
  let f=[],d=digits.join(''),dc={},lc={};
  digits.forEach(x=>dc[x]=(dc[x]||0)+1);letters.forEach(x=>lc[x]=(lc[x]||0)+1);
  Object.keys(dc).forEach(x=>{if(dc[x]===3)f.push(['Три '+x,18]);else if(dc[x]===2)f.push(['Две '+x,2.5])});
  Object.keys(lc).forEach(x=>{if(lc[x]===3)f.push(['Три '+x,14]);else if(lc[x]===2)f.push(['Две '+x,2])});
  if(d==='001')f.push(['Начальные нули',7]);if(d==='007')f.push(['Комбинация 007',10]);
  if(d==='123'||d==='321')f.push(['Последовательность '+d,8]);
  if(digits[0]===digits[2]&&digits[0]!==digits[1])f.push(['Зеркальные цифры',4]);
  if(letters[0]===letters[2]&&letters[0]!==letters[1])f.push(['Зеркальные буквы',3]);
  if(['77','97','99','177','197','199','777'].indexOf(region)>=0)f.push(['Москва',1.2]);
  if(region.length===3)f.push(['Трёхзначный регион',1.12]);
  return f;
}

  document.body.appendChild(d);

function generate(){
  if(Math.random()<0.00012){let available=SPECIAL_PLATES.filter(function(t){return !S.specialClaimed[t.id] && !(ONLINE.uniqueClaims&&ONLINE.uniqueClaims[t.id])});if(available.length)return specialFromTemplate(pick(available));}
  let digits=[0,1,2].map(function(){return Math.floor(Math.random()*10)});
  let letters=[0,1,2].map(function(){return pick(LETTERS)});
  let r=pick(REGIONS),d=digits.join(''),f=findings(letters,digits,r[0]),mult=1;
  f.forEach(x=>{mult*=x[1]});
  let ev=event();
  if(ev.kind==='beauty'&&['777','001','007','123','321'].indexOf(d)>=0)mult*=1.22;
  if(ev.kind==='moscow'&&['77','97','99','177','197','199','777'].indexOf(r[0])>=0)mult*=1.2;
  if(ev.kind==='sport'&&['007','123','321'].indexOf(d)>=0)mult*=1.15;
  if(ev.kind==='mirror'&&(digits[0]===digits[2]||letters[0]===letters[2]))mult*=1.22;
  let luck=S.luck-1+(S.luckBoostSpins>0?S.luckBoost:0),q=Math.random(),rarity='Обычная';
  if(q<0.0005+luck*.00025)rarity='Уникальная';
  else if(q<0.004+luck*.0012)rarity='Легендарная';
  else if(q<0.035+luck*.006)rarity='Эпическая';
  else if(q<0.16+luck*.015)rarity='Редкая';
  let base={'Обычная':700,'Редкая':3500,'Эпическая':18000,'Легендарная':90000,'Уникальная':1000000}[rarity];
  return {id:Date.now()+Math.random(),letters:letters,digits:digits,region:r[0],regionName:r[1],rarity:rarity,value:Math.max(100,Math.round(base*mult)),findings:f.map(function(x){return x[0]}),text:letters[0]+d+letters[1]+letters[2]};
}

function spin(){
  if(rolling||S.money<COST){
    if(S.money<COST)toast('Недостаточно виртуальных ₽');
    return;
  }

  // Небольшой защитный таймер: если Safari/iOS прервал анимацию,
  // кнопки не останутся заблокированными навсегда.
  if(window.__spinWatchdog)clearTimeout(window.__spinWatchdog);
  window.__spinWatchdog=setTimeout(function(){
    if(rolling){
      rolling=false;
      if(window.__spinTimer)clearTimeout(window.__spinTimer);
      window.__spinTimer=null;
      save();
      render();
      toast('Анимация восстановлена');
    }
  },12000);

  S.money-=COST;
  S.stats.spent+=COST;
  S.stats.spins++;
  save();
  rolling=true;
  render();

  let n=0,total=17;
  function tick(){
    if(!rolling)return;
    try{
      let el=document.getElementById('rolling');
      if(el){
        let q=generate();
        el.innerHTML=plate(q)+info(q);
      }
      n++;
      if(n>=total){
        finish();
        return;
      }
      window.__spinTimer=setTimeout(tick,78+n*4);
    }catch(err){
      // Любая ошибка внутри анимации больше не оставляет игру в состоянии rolling=true.
      rolling=false;
      if(window.__spinWatchdog)clearTimeout(window.__spinWatchdog);
      window.__spinWatchdog=null;
      window.__spinTimer=null;
      save();
      render();
      toast('Анимация восстановлена');
      if(window.__onlineReopen){window.__onlineReopen=false;setTimeout(openOnline,180)}
      console.error('Номерок spin:',err);
    }
  }

  async function finish(){
    try{
      let p=null,claimed=false;
      for(let attempt=0;attempt<4&&!claimed;attempt++){
        p=generate();
        claimed=await claimGlobalPlate(p);
      }
      if(!claimed){
        S.money+=COST;
        S.stats.spent=Math.max(0,S.stats.spent-COST);
        S.stats.spins=Math.max(0,S.stats.spins-1);
        save();
        rolling=false;window.__spinTimer=null;if(window.__spinWatchdog)clearTimeout(window.__spinWatchdog);window.__spinWatchdog=null;render();
        toast('Этот номер уже занят. ₽ возвращены.');
        if(window.__onlineReopen){window.__onlineReopen=false;setTimeout(openOnline,180)}
        return;
      }
      S.last=p;
      S.stats.bestValue=Math.max(S.stats.bestValue,p.value);
      if(p.value===S.stats.bestValue){
        S.stats.bestText=p.text+' '+p.region;
        S.stats.bestRarity=p.rarity;
      }
      if(!S.regions.includes(p.region))S.regions.push(p.region);
      xp(p.rarity==='Уникальная'?45:p.rarity==='Легендарная'?32:p.rarity==='Эпическая'?20:p.rarity==='Редкая'?12:5);
      if(S.luckBoostSpins>0){
        S.luckBoostSpins--;
        if(!S.luckBoostSpins)S.luckBoost=0;
      }
      S.plates.unshift(p);
      S.plates=S.plates.slice(0,S.storageMax);
      if(p.specialId)S.specialClaimed[p.specialId]=true;
      save();
      rolling=false;
      window.__spinTimer=null;
      if(window.__spinWatchdog)clearTimeout(window.__spinWatchdog);
      window.__spinWatchdog=null;
      render();
      if(ONLINE.room)syncResult(p).catch(function(e){toast('Онлайн: '+(e.message||'ошибка синхронизации'))});
      if(isSpecial(p)){showUniqueReveal(p,function(){toast('Уникальный номер добавлен в хранилище');if(window.__onlineReopen){window.__onlineReopen=false;setTimeout(openOnline,120)}})}else{toast('Номер выпал!');if(window.__onlineReopen){window.__onlineReopen=false;setTimeout(openOnline,260)}}
    }catch(err){
      /* Если глобальный реестр недоступен, списание не должно пропасть. */
      S.money+=COST;
      S.stats.spent=Math.max(0,S.stats.spent-COST);
      S.stats.spins=Math.max(0,S.stats.spins-1);
      rolling=false;
      window.__spinTimer=null;
      if(window.__spinWatchdog)clearTimeout(window.__spinWatchdog);
      window.__spinWatchdog=null;
      save();
      render();
      toast(err&&err.message?err.message:'Не удалось зарегистрировать номер. ₽ возвращены.');
      if(window.__onlineReopen){window.__onlineReopen=false;setTimeout(openOnline,180)}
      console.error('Номерок finish:',err);
    }
  }

  tick();
}
