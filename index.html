<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Номерок — коллекционер</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050506;color:#f7f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0}
body{padding-bottom:96px}
.app{max-width:620px;margin:auto;min-height:100vh;padding:16px 14px 112px;overflow:hidden}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{font-size:24px;font-weight:950;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#8d9098;margin-top:2px}
.balance{text-align:right;font-weight:950;font-size:20px;white-space:nowrap}
.balance small{display:block;color:#777b84;font-size:11px;font-weight:800;margin-bottom:1px}
.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:9px;margin-top:18px}
.pill{background:#19191c;border:1px solid #252529;border-radius:22px;padding:12px 13px;font-weight:900}
.pill b{font-size:17px}.muted{color:#85868d;font-size:11px}
.progress{height:6px;background:#2d2e33;border-radius:10px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#31d158,#68ff8c);border-radius:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#1b1b1e;border:1px solid #2b2b30;border-radius:18px;padding:3px;margin-top:16px}
.tab{background:transparent;padding:12px;border-radius:15px;font-weight:900;color:#909097}.tab.active{background:#66676b;color:#fff}
.banner{margin-top:14px;padding:12px 14px;border-radius:22px;border:1px solid #6c1c3b;background:linear-gradient(105deg,#260b19,#1c1720);display:flex;align-items:center;gap:11px}
.banner .icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#ff315e;font-size:23px;flex:0 0 auto}
.banner b{font-size:16px}.banner span{color:#aaa8b0;font-size:12px;font-weight:800;display:block;margin-top:3px}
.card{background:linear-gradient(145deg,#151519,#0e0e11);border:1px solid #222329;border-radius:26px;padding:15px;margin-top:14px;box-shadow:0 16px 50px rgba(0,0,0,.28)}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:950;margin-bottom:10px}.sectionTitle span{font-size:12px;color:#8c8e95}
.plateWrap{margin-top:25px}
.plate{position:relative;background:linear-gradient(#fff,#e9e9e7);color:#0c0c0d;border:4px solid #151516;border-radius:15px;box-shadow:0 0 0 2px #ddd,0 12px 35px rgba(255,255,255,.08);display:flex;align-items:stretch;min-height:108px;overflow:hidden}
.plateMain{display:flex;align-items:center;justify-content:center;flex:1;letter-spacing:7px;font-size:55px;font-weight:900;white-space:nowrap;padding-left:8px}
.plateRegion{width:112px;border-left:4px solid #171719;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.plateRegion strong{font-size:43px;line-height:.95}.plateRegion .rus{font-size:16px;margin-top:8px;display:flex;align-items:center;gap:4px}.flag{width:25px;height:15px;border:1px solid #aaa;background:linear-gradient(#fff 0 33%,#2155ad 33% 66%,#d52b35 66%)}
.plateInfo{text-align:center;margin-top:12px}.region{color:#777981;font-weight:800;font-size:13px}.finding{font-weight:950;font-size:18px;margin-top:6px}.value{font-weight:950;font-size:27px;margin-top:3px}.rarity{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:950;margin-top:7px;background:#25262b;color:#ddd}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.btn{padding:14px 12px;border-radius:18px;background:#242428;font-weight:950}.btn.primary{background:#28d65a;color:#06100a;box-shadow:0 10px 30px rgba(40,214,90,.16)}.btn.red{background:#35151c;color:#ff8da4}.btn.blue{background:#171e34;color:#9eb4ff}
.spinBox{margin-top:17px;text-align:center}
.costNote{color:#85868d;font-size:12px;font-weight:800;margin:7px 0}
.spin:disabled{opacity:.4;filter:grayscale(1);box-shadow:none;cursor:not-allowed}.spin{width:100%;padding:17px;border-radius:24px;background:linear-gradient(100deg,#2ad95a,#1fca52);color:#06100a;font-size:23px;font-weight:950;box-shadow:0 14px 40px rgba(37,215,87,.22)}
.spin small{font-size:13px;margin-left:8px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:rgba(12,12,14,.95);backdrop-filter:blur(18px);border-top:1px solid #242429;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{background:transparent;color:#74767d;font-size:10px;font-weight:900;padding:7px 2px}.nav button.active{color:#fff}.nav .ni{font-size:20px;display:block;margin-bottom:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.smallCard{background:#17171b;border:1px solid #25252b;border-radius:20px;padding:12px}
.smallCard h3{font-size:14px;margin:0 0 5px}.smallCard p{margin:0;color:#85878e;font-size:11px;line-height:1.35}
.container{position:relative;overflow:hidden;min-height:190px;border-radius:23px;padding:15px;background:linear-gradient(145deg,#191a20,#101115);border:1px solid #2a2c35}
.container .box{font-size:54px;text-align:center;padding:12px}.container h3{text-align:center;margin:0;font-size:17px}.container p{text-align:center;color:#8c8e96;font-size:11px}.container .open{width:100%;margin-top:8px;padding:11px;border-radius:15px;background:#25262b;font-weight:950}.container.common{box-shadow:inset 0 0 60px rgba(130,135,145,.05)}.container.rare{box-shadow:inset 0 0 60px rgba(73,113,255,.12)}.container.epic{box-shadow:inset 0 0 60px rgba(203,74,255,.12)}
.car{background:linear-gradient(150deg,#17181c,#0e0e11);border:1px solid #28292e;border-radius:23px;padding:14px;position:relative;overflow:hidden}.car .emoji{font-size:56px;text-align:center;padding:8px}.car h3{margin:2px 0;font-size:16px}.car .meta{font-size:11px;color:#85878e}.car .price{font-weight:950;margin-top:8px}.tag{position:absolute;right:10px;top:10px;background:#25262b;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950}
.progressLine{height:7px;background:#2a2b30;border-radius:10px;overflow:hidden;margin-top:8px}.progressLine i{display:block;height:100%;background:linear-gradient(90deg,#48d96b,#b6ff74)}
.quest{display:flex;gap:10px;align-items:center;background:#18181c;border:1px solid #25262b;border-radius:18px;padding:11px;margin-top:8px}.quest .qicon{width:38px;height:38px;border-radius:13px;background:#26272d;display:grid;place-items:center;font-size:19px}.quest b{font-size:13px}.quest span{display:block;color:#8a8c93;font-size:10px;margin-top:2px}.quest .reward{margin-left:auto;font-weight:950;color:#aef7bd}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.regionTile{background:#17171b;border:1px solid #25262a;border-radius:13px;padding:9px 3px;text-align:center;font-size:10px;font-weight:900}.regionTile.done{border-color:#36d96a;background:#132117}.regionTile .r{font-size:15px;margin-bottom:3px}.statRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #222329;font-size:13px}.statRow:last-child{border-bottom:0}.statRow span{color:#85878e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(620px,100%);background:#151518;border:1px solid #2b2c31;border-radius:28px 28px 0 0;padding:18px 15px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}.sheet h2{text-align:center;margin:3px 0 14px}.close{width:100%;padding:13px;border-radius:17px;background:#292a2f;font-weight:950;margin-top:10px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}.shaking{animation:shake .13s infinite}
.empty{text-align:center;padding:28px 8px;color:#85878e}.empty b{display:block;color:#fff;font-size:17px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:11px 15px;border-radius:14px;font-weight:900;font-size:12px;opacity:0;pointer-events:none;z-index:70;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:430px){.plateMain{font-size:46px;letter-spacing:5px}.plateRegion{width:90px}.plateRegion strong{font-size:37px}.stats{grid-template-columns:1fr 1fr 1.2fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">Номерок | Генератор номеров</div><div class="sub">коллекционер • тестовая версия</div></div>
    <div class="balance"><small>Баланс</small><span id="balance">500 000 ₽</span></div>
  </div>

  <div class="stats">
    <div class="pill">Ур. <b id="level">1</b><div class="progress"><i id="xpbar" style="width:15%"></i></div></div>
    <div class="pill">🍀 <b id="luck">1</b><div class="muted">удача</div></div>
    <div class="pill">🔑 <b id="keys">3</b><div class="muted">ключи</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="platesTab" onclick="setTop('plates')">Номера</button>
    <button class="tab" id="carsTab" onclick="setTop('cars')">Машины</button>
  </div>

  <div id="main"></div>
</div>

<div class="nav">
  <button id="navSpin" class="active" onclick="setPage('spin')"><span class="ni">🎰</span>Крутить</button>
  <button id="navStore" onclick="setPage('store')"><span class="ni">🗃️</span>Хранилище</button>
  <button id="navBoxes" onclick="setPage('boxes')"><span class="ni">📦</span>Контейнеры</button>
  <button id="navGarage" onclick="setPage('garage')"><span class="ni">🚘</span>Гараж</button>
  <button id="navMore" onclick="setPage('more')"><span class="ni">🏆</span>Профиль</button>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const LETTERS='АВЕКМНОРСТУХ'.split('');
const REGIONS=[
['77','Москва'],['97','Москва'],['99','Москва'],['177','Москва'],['197','Москва'],['199','Москва'],['777','Москва'],
['78','Санкт-Петербург'],['98','Санкт-Петербург'],['178','Санкт-Петербург'],['198','Санкт-Петербург'],
['23','Краснодарский край'],['93','Краснодарский край'],['123','Краснодарский край'],['193','Краснодарский край'],
['50','Московская область'],['90','Московская область'],['150','Московская область'],['190','Московская область'],
['52','Нижегородская область'],['152','Нижегородская область'],['54','Новосибирская область'],['154','Новосибирская область'],
['66','Свердловская область'],['96','Свердловская область'],['196','Свердловская область'],['16','Татарстан'],['116','Татарстан'],
['61','Ростовская область'],['161','Ростовская область'],['62','Рязанская область'],['67','Смоленская область'],
['40','Калужская область'],['43','Кировская область'],['46','Курская область'],['48','Липецкая область'],['55','Омская область'],
['63','Самарская область'],['163','Самарская область'],['64','Саратовская область'],['72','Тюменская область'],
['74','Челябинская область'],['174','Челябинская область'],['95','Чеченская Республика'],['26','Ставропольский край'],
['42','Кемеровская область'],['70','Томская область'],['71','Тульская область'],['86','ХМАО'],['89','ЯНАО']
];
const CARS=[
{name:'Lada Granta Sport',emoji:'🚗',rarity:'Обычная',price:420000},
{name:'Lada Vesta Sport',emoji:'🏎️',rarity:'Редкая',price:980000},
{name:'Toyota Supra',emoji:'🏁',rarity:'Эпическая',price:5200000},
{name:'Nissan GT-R',emoji:'🚘',rarity:'Легендарная',price:9800000},
{name:'Porsche 911',emoji:'🏎️',rarity:'Легендарная',price:12400000},
{name:'Lamborghini Huracán',emoji:'🟨',rarity:'Уникальная',price:18500000}
];
const BOXES=[
{name:'Гаражный контейнер',icon:'📦',need:1,rarity:'Обычный',cls:'common',cars:[0]},
{name:'Спортивный контейнер',icon:'🎁',need:3,rarity:'Редкий',cls:'rare',cars:[0,1,2]},
{name:'Премиум контейнер',icon:'💎',need:5,rarity:'Эпический',cls:'epic',cars:[1,2,3,4,5]}
];
let state;
try{state=JSON.parse(localStorage.getItem('nomerok_full')||'null')}catch(e){state=null}
state=state||{balance:500000,level:1,xp:0,luck:1,keys:3,plates:[],cars:[],page:'spin',last:null,stats:{spins:0,sold:0,opened:0},regions:[],quests:{spins:0,rare:0,containers:0},season:1};
let page=state.page||'spin', top='plates';

function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function save(){try{localStorage.setItem('nomerok_full',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function weightedRarity(){
  const x=Math.random();
  if(x<.002) return 'Уникальная';
  if(x<.012) return 'Легендарная';
  if(x<.06) return 'Эпическая';
  if(x<.22) return 'Редкая';
  return 'Обычная';
}
function generatePlate(){
  let d=[rand(0,9),rand(0,9),rand(0,9)];
  const letters=[LETTERS[rand(0,LETTERS.length-1)],LETTERS[rand(0,LETTERS.length-1)],LETTERS[rand(0,LETTERS.length-1)]];
  const reg=REGIONS[rand(0,REGIONS.length-1)];
  const s=d.join('');
  let findings=[], mult=1;
  const counts={}; d.forEach(v=>counts[v]=(counts[v]||0)+1);
  const repeats=Object.values(counts).sort((a,b)=>b-a)[0];
  if(repeats===3){findings.push('Три одинаковые цифры');mult=18}
  else if(repeats===2){findings.push('Две одинаковые цифры');mult=2.5}
  const lc={}; letters.forEach(v=>lc[v]=(lc[v]||0)+1);
  const lr=Object.values(lc).sort((a,b)=>b-a)[0];
  if(lr===3){findings.push('Три одинаковые буквы');mult=Math.max(mult,14)}
  else if(lr===2){findings.push('Две одинаковые буквы');mult=Math.max(mult,2)}
  if(s==='123'||s==='321'||s==='007'){findings.push('Особая последовательность');mult=Math.max(mult,7)}
  if(s==='777'||s==='666'||s==='999'||s==='555'){findings.push('Популярная комбинация');mult=Math.max(mult,10)}
  if(['77','97','99','177','197','199','777'].includes(reg[0])){findings.push('Популярный регион');mult*=1.2}
  const rarity=weightedRarity();
  const base={Обычная:500,Редкая:2500,Эпическая:12000,Легендарная:50000,Уникальная:250000}[rarity];
  const value=Math.round(base*mult);
  return {id:Date.now()+Math.random(),letters, digits:d, region:reg[0], regionName:reg[1], text:letters[0]+d[0]+d[1]+d[2]+letters[1]+letters[2], findings:findings.length?findings:['Без особых совпадений'], rarity,value};
}
function rarityColor(r){return r==='Уникальная'?'#ff76e5':r==='Легендарная'?'#ffad48':r==='Эпическая'?'#bd83ff':r==='Редкая'?'#78a7ff':'#9b9da5'}
function plateHTML(p){
  return `<div class="plateWrap"><div class="plate">
    <div class="plateMain">${esc(p.letters[0])} ${p.digits.join('')} ${esc(p.letters[1])}${esc(p.letters[2])}</div>
    <div class="plateRegion"><strong>${esc(p.region)}</strong><div class="rus">RUS <i class="flag"></i></div></div>
  </div>
  <div class="plateInfo"><div class="region">Регион ${esc(p.region)} · ${esc(p.regionName)}</div>
  <div class="finding">${esc(p.findings.join(' • '))}</div><div class="value">${money(p.value)}</div>
  <div class="rarity" style="color:${rarityColor(p.rarity)}">${esc(p.rarity)}</div></div></div>`;
}
function setTop(v){top=v;document.getElementById('platesTab').classList.toggle('active',v==='plates');document.getElementById('carsTab').classList.toggle('active',v==='cars');render()}
function setPage(v){page=v;state.page=v;save();render();window.scrollTo(0,0)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function addXP(n){state.xp+=n;while(state.xp>=100){state.xp-=100;state.level++;state.keys++;toast('Новый уровень! +1 ключ 🔑')}}
function spin(){
  const COST=5000;
  const btn=document.getElementById('spinBtn');if(!btn)return;
  if(state.balance<COST){toast('Недостаточно средств — нужно 5 000 ₽');return}
  state.balance-=COST;
  save();
  render();
  const activeBtn=document.getElementById('spinBtn');if(activeBtn){activeBtn.disabled=true;activeBtn.textContent='Прокрутка…'}
  const card=document.getElementById('plateCard');if(card)card.classList.add('shaking');
  let ticks=0;const total=15;const timer=setInterval(()=>{
    const tmp=generatePlate();const area=document.getElementById('rolling');if(area)area.innerHTML=plateHTML(tmp);
    ticks++;
    if(ticks>=total){clearInterval(timer);finishSpin()}
  },80+ticks*9);
}
function finishSpin(){
  const p=generatePlate();state.last=p;state.stats.spins++;state.quests.spins++;addXP(12);
  if(!state.regions.includes(p.region))state.regions.push(p.region);
  if(p.rarity!=='Обычная')state.quests.rare++;
  save();render();toast('Номер выпал! Выбери действие');
}
function storeLast(){
  if(!state.last)return;state.plates.unshift(state.last);state.last=null;addXP(5);save();render();toast('Номер добавлен в хранилище 🗃️')
}
function sellLast(){
  if(!state.last)return;state.balance+=state.last.value;state.stats.sold++;state.last=null;addXP(3);save();render();toast('Номер продан за деньги')
}
function sellPlate(id){
  const i=state.plates.findIndex(x=>x.id===id);if(i<0)return;
  const p=state.plates[i];state.balance+=p.value;state.plates.splice(i,1);state.stats.sold++;save();render();toast('Продано за '+money(p.value))
}
function openBox(i){
  const b=BOXES[i];if(state.keys<b.need){toast('Не хватает ключей 🔑');return}
  state.keys-=b.need;state.stats.opened++;state.quests.containers++;addXP(18);
  const choices=b.cars;const ci=choices[rand(0,choices.length-1)];const car=CARS[ci];
  state.cars.push({...car,id:Date.now()+Math.random()});save();
  showModal(`<h2>${b.icon} Контейнер открыт!</h2><div class="car"><div class="tag">${car.rarity}</div><div class="emoji">${car.emoji}</div><h3>${esc(car.name)}</h3><div class="meta">Новая машина добавлена в гараж</div><div class="price">${money(car.price)}</div></div><button class="close" onclick="closeModal()">Забрать в гараж</button>`);
}
function showModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function spinView(){
 const p=state.last;
 return `<div class="banner"><div class="icon">💥</div><div><b>Собери коллекцию регионов</b><span>Новые регионы открывают достижения и повышают удачу.</span></div></div>
 <div class="card" id="plateCard"><div class="sectionTitle"><span>Последний результат</span><span>${state.stats.spins} прокруток</span></div>
 <div id="rolling">${p?plateHTML(p):`<div class="empty"><b>Готов к новой находке</b>Нажми кнопку ниже — выпадет случайный номер из общего пула.</div>`}</div>
 ${p?`<div class="actions"><button class="btn primary" onclick="storeLast()">🗃️ В хранилище</button><button class="btn red" onclick="sellLast()">💰 Продать</button></div>`:''}</div>
 <div class="spinBox"><div class="costNote">🎟️ Стоимость одной прокрутки — 5 000 ₽ · Баланс: ${money(state.balance)}</div><button class="spin" id="spinBtn" onclick="spin()" ${state.balance<5000?'disabled':''}>${state.balance<5000?'Недостаточно средств':'Крутить за 5 000 ₽'} <small>🎲 случайный номер</small></button></div>
 <div class="card"><div class="sectionTitle">Сезон 1 · Коллекционер <span>Ур. ${state.level}</span></div>
 <div class="quest"><div class="qicon">🎯</div><div><b>Сделать 10 прокруток</b><span>${Math.min(state.quests.spins,10)} / 10</span></div><div class="reward">+1 🔑</div></div>
 <div class="quest"><div class="qicon">✨</div><div><b>Найти 3 редких номера</b><span>${Math.min(state.quests.rare,3)} / 3</span></div><div class="reward">+1 🔑</div></div>
 <div class="quest"><div class="qicon">📦</div><div><b>Открыть 2 контейнера</b><span>${Math.min(state.quests.containers,2)} / 2</span></div><div class="reward">+2 🔑</div></div></div>`;
}
function storeView(){
 return `<div class="card"><div class="sectionTitle">Хранилище <span>${state.plates.length} ном.</span></div>
 ${state.plates.length?`<div>${state.plates.map(p=>`<div class="smallCard" style="margin-top:9px"><div>${plateHTML(p)}</div><div class="actions"><button class="btn red" onclick="sellPlate(${p.id})">Продать · ${money(p.value)}</button></div></div>`).join('')}</div>`:`<div class="empty"><b>Хранилище пусто</b>Сохраняй понравившиеся номера после выпадения.</div>`}</div>
 <div class="card"><div class="sectionTitle">Альбом регионов <span>${state.regions.length}/${REGIONS.length}</span></div><div class="album">${REGIONS.map(r=>`<div class="regionTile ${state.regions.includes(r[0])?'done':''}"><div class="r">${r[0]}</div>${state.regions.includes(r[0])?'✓':'?'}</div>`).join('')}</div></div>`;
}
function boxesView(){
 return `<div class="card"><div class="sectionTitle">Контейнеры <span>${state.keys} 🔑</span></div><p class="muted">Ключи зарабатываются за уровни и достижения. Контейнеры не требуют покупки случайного результата.</p><div class="grid">${BOXES.map((b,i)=>`<div class="container ${b.cls}"><div class="box">${b.icon}</div><h3>${b.name}</h3><p>${b.rarity} · ${b.need} ключей</p><button class="open" onclick="openBox(${i})">Открыть · 🔑 ${b.need}</button></div>`).join('')}</div></div>
 <div class="card"><div class="sectionTitle">Как получить ключи</div><div class="quest"><div class="qicon">⭐</div><div><b>Повышай уровень</b><span>За каждый новый уровень +1 ключ</span></div></div><div class="quest"><div class="qicon">🏆</div><div><b>Закрывай достижения</b><span>Ключи выдаются за игровые цели</span></div></div></div>`;
}
function garageView(){
 return `<div class="card"><div class="sectionTitle">Гараж <span>${state.cars.length} машин</span></div>${state.cars.length?`<div class="grid">${state.cars.map(c=>`<div class="car"><div class="tag">${esc(c.rarity)}</div><div class="emoji">${c.emoji}</div><h3>${esc(c.name)}</h3><div class="meta">Коллекционная машина</div><div class="price">${money(c.price)}</div></div>`).join('')}</div>`:`<div class="empty"><b>Гараж пуст</b>Открывай контейнеры, чтобы получать машины.</div>`}</div>
 <div class="card"><div class="sectionTitle">Коллекция машин</div><div class="grid">${CARS.map(c=>`<div class="smallCard"><div style="font-size:32px">${c.emoji}</div><h3>${esc(c.name)}</h3><p>${c.rarity} · ${money(c.price)}</p></div>`).join('')}</div></div>`;
}
function moreView(){
 const totalValue=state.plates.reduce((a,p)=>a+p.value,0)+state.cars.reduce((a,c)=>a+c.price,0);
 return `<div class="card"><div class="sectionTitle">Профиль коллекционера <span>Сезон ${state.season}</span></div>
 <div class="statRow"><b>Уровень</b><span>${state.level}</span></div><div class="statRow"><b>Опыт</b><span>${state.xp}/100 XP</span></div><div class="statRow"><b>Найдено номеров</b><span>${state.stats.spins}</span></div><div class="statRow"><b>В хранилище</b><span>${state.plates.length}</span></div><div class="statRow"><b>Машин</b><span>${state.cars.length}</span></div><div class="statRow"><b>Продано номеров</b><span>${state.stats.sold}</span></div><div class="statRow"><b>Оценочная стоимость коллекции</b><span>${money(totalValue)}</span></div></div>
 <div class="card"><div class="sectionTitle">Достижения</div><div class="quest"><div class="qicon">🏁</div><div><b>Первый номер</b><span>${state.stats.spins?'Выполнено':'Сделай первую прокрутку'}</span></div><div class="reward">${state.stats.spins?'✓':'+'}</div></div>
 <div class="quest"><div class="qicon">🗺️</div><div><b>10 регионов</b><span>${Math.min(state.regions.length,10)} / 10</span></div><div class="reward">${state.regions.length>=10?'✓':'+1 🔑'}</div></div>
 <div class="quest"><div class="qicon">🚘</div><div><b>3 машины</b><span>${Math.min(state.cars.length,3)} / 3</span></div><div class="reward">${state.cars.length>=3?'✓':'+2 🔑'}</div></div></div>`;
}
function render(){
 document.getElementById('balance').textContent=money(state.balance);
 document.getElementById('level').textContent=state.level;
 document.getElementById('luck').textContent=state.luck;
 document.getElementById('keys').textContent=state.keys;
 document.getElementById('xpbar').style.width=state.xp+'%';
 ['spin','store','boxes','garage','more'].forEach(v=>{const el=document.getElementById('nav'+v[0].toUpperCase()+v.slice(1));if(el)el.classList.toggle('active',page===v)});
 const main=document.getElementById('main');
 if(top==='cars' && page!=='garage') main.innerHTML=garageView();
 else if(page==='spin')main.innerHTML=spinView();
 else if(page==='store')main.innerHTML=storeView();
 else if(page==='boxes')main.innerHTML=boxesView();
 else if(page==='garage')main.innerHTML=garageView();
 else main.innerHTML=moreView();
}
render();
</script>
</body>
</html>
