plates:[],cars:[],last:null,page:'spin',top:'plates',regions:[],
storageMax:20,garageMax:6,spinStreak:0,luckBoost:0,luckBoostSpins:0,
stats:{spins:0,sold:0,opened:0,bestValue:0,bestText:'—',bestRarity:'—',spent:0,earned:0,rare:0},
achClaimed:{},marketSold:0,
daily:{date:'',bonusClaimed:false,quests:{}},
recoveryDate:'',
upgrade:{luck:0,storage:0,garage:0}
};
let state;
try{state=JSON.parse(localStorage.getItem('nomerok_ultra_v2')||'null')}catch(e){state=null}
state=Object.assign({},defaults,state||{});
state.stats=Object.assign({},defaults.stats,state.stats||{});
state.daily=Object.assign({},defaults.daily,state.daily||{});
state.upgrade=Object.assign({},defaults.upgrade,state.upgrade||{});state.luckBoost=Number(state.luckBoost||0);state.luckBoostSpins=Number(state.luckBoostSpins||0);
state.plates=Array.isArray(state.plates)?state.plates:[];
state.cars=Array.isArray(state.cars)?state.cars:[];
state.regions=Array.isArray(state.regions)?state.regions:[];
state.achClaimed=state.achClaimed||{};
let page=state.page||'spin';
let activeTop=state.top||'plates';
let rolling=false;

function today(){return new Date().toISOString().slice(0,10)}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function save(){try{localStorage.setItem('nomerok_ultra_v2',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rand(0,a.length-1)]}
function rarityColor(r){return r==='Уникальная'?'#ff78e7':r==='Легендарная'?'#ffc15b':r==='Эпическая'?'#c688ff':r==='Редкая'?'#82aaff':'#a2a4ab'}
function ensureDaily(){
  const d=today();
  if(state.daily.date!==d){state.daily={date:d,bonusClaimed:false,quests:{spins:0,sell:0,rare:0}};save()}
}
ensureDaily();

function rollRarity(){
  const luckBonus=(state.luck-1)*0.006;
  const x=Math.random();
  if(x<0.0005+luckBonus*0.03)return'Уникальная';
  if(x<0.004+luckBonus*0.25)return'Легендарная';
  if(x<0.035+luckBonus*0.8)return'Эпическая';
  if(x<0.16+luckBonus*1.7)return'Редкая';
  return'Обычная';
}
function generatePlate(){
  const digits=[rand(0,9),rand(0,9),rand(0,9)];
  const letters=[pick(LETTERS),pick(LETTERS),pick(LETTERS)];
  const reg=pick(REGIONS);
  const ds=digits.join('');
  const ls=letters.join('');
  const findings=[]; let mult=1;
  const dc={};digits.forEach(d=>dc[d]=(dc[d]||0)+1);
  const lc={};letters.forEach(l=>lc[l]=(lc[l]||0)+1);
  const dr=Math.max(...Object.values(dc)),lr=Math.max(...Object.values(lc));
  const add=(label,m)=>{findings.push(label+' ×'+String(m).replace('.',','));mult*=m};
  if(ds==='000') add('три нуля',22);
  else if(['111','222','333','444','555','666','777','888','999'].includes(ds)) add('три одинаковые цифры',18);
  else if(dr===2) add('две одинаковые цифры',2.5);
  if(ds==='001'||ds==='007') add('особая комбинация '+ds,7);
  if(['123','321'].includes(ds)) add('последовательность '+ds,7);
  if(ds[0]===ds[2]&&ds[0]!==ds[1]) add('зеркальные цифры',1.8);
  if(ds[0]+ds[1]===ds[2]+ds[1] && ds[0]!==ds[2]) add('парная симметрия',1.15);
  if(lr===3) add('три одинаковые буквы',14);
  else if(lr===2) add('две одинаковые буквы',2);
  if(letters[0]===letters[2]&&letters[1]!==letters[0]) add('зеркальные буквы',3);
  const popularRegions=['77','97','99','177','197','199','777'];
  if(popularRegions.includes(reg[0])) add('Москва',1.2);
  if(reg[0].length===3) add('трёхзначный регион',1.12);
  if(['М','М','М'].every(x=>letters.includes(x)) && lr===3) add('серия МММ',1.15);
  const luck=(state.luck||1)-1 + ((state.luckBoostSpins||0)>0?(state.luckBoost||0):0);
  const luckBonus=Math.min(.08,luck*.006);
  const comboBoost=Math.min(.07,Math.log(mult+1)/85);
  const x=Math.random();
  let rarity='Обычная';
  if(x<0.00045+luckBonus*0.03+comboBoost*0.02) rarity='Уникальная';
  else if(x<0.004+luckBonus*0.22+comboBoost*0.18) rarity='Легендарная';
  else if(x<0.035+luckBonus*0.78+comboBoost*0.55) rarity='Эпическая';
  else if(x<0.16+luckBonus*1.65+comboBoost*1.4) rarity='Редкая';
  const base={Обычная:700,Редкая:3500,Эпическая:18000,Легендарная:90000,Уникальная:1000000}[rarity];
  const comboScore=Math.round(Math.log2(Math.max(1,mult))*10);
  return{
    id:Date.now()+Math.random(),letters,digits,region:reg[0],regionName:reg[1],
    text:letters[0]+digits.join('')+letters[1]+letters[2],findings:findings.length?findings:['обычная комбинация'],
    rarity,value:Math.max(100,Math.round(base*mult)),comboScore
  };
}

function rarityClass(r){return r==='Уникальная'?'rarity-unique':r==='Легендарная'?'rarity-legend':r==='Эпическая'?'rarity-epic':r==='Редкая'?'rarity-rare':'rarity-common'}
function rarityIcon(r){return r==='Уникальная'?'💠':r==='Легендарная'?'👑':r==='Эпическая'?'🔥':r==='Редкая'?'✨':'•'}
function plateHTML(p,mini=false){
  const l0=esc(p.letters?.[0]||'А'), l1=esc(p.letters?.[1]||'А'), l2=esc(p.letters?.[2]||'А');
  const ds=esc((p.digits||[]).join(''));
  return `<div class="plateWrap"><div class="plate ${mini?'':'heroPlate'} ${p.rarity?rarityClass(p.rarity):''}">
    <i class="plateScrew tl"></i><i class="plateScrew bl"></i><i class="plateScrew tr"></i><i class="plateScrew br"></i>
    <div class="plateMain"><span class="plateFirst">${l0}</span><span class="plateDigits">${ds}</span><span class="plateLetters">${l1}${l2}</span></div>
    <div class="plateRegion"><strong>${esc(p.region||'77')}</strong><div class="rus">RUS <i class="flag"></i></div><div class="plateType">RUSSIAN FEDERATION</div></div>
  </div></div>`;
}
function plateInfoHTML(p){
  const findings=(p.findings||[]).filter(Boolean);
  return `<div class="plateText">
    <div class="format">${esc(p.letters?.[0]||'А')} ${esc((p.digits||[]).join(''))} ${esc((p.letters||[]).slice(1).join(''))} · государственный номер</div>
    <div class="region">Регион ${esc(p.region)} · ${esc(p.regionName)}</div>
    ${findings.length?`<div class="findingList">${findings.map(x=>`<span class="finding">${esc(x)}</span>`).join('')}</div>`:'<div class="plateHint">Без особых совпадений</div>'}
    <div class="price">${money(p.value)}</div>
    <div class="rarity ${rarityClass(p.rarity)}" style="color:${rarityColor(p.rarity)}">${rarityIcon(p.rarity)} ${esc(p.rarity)}</div>
  </div>`;
}
function fullPlateHTML(p){
  return `<div class="plateArea">${plateHTML(p)}${plateInfoHTML(p)}</div>`;
}

function addXP(n){
  state.xp+=n;
  while(state.xp>=100){
    state.xp-=100;
    state.level++;
    state.keys++;
    toast('Новый уровень! +1 🔑');
  }
}
function spin(){
  ensureDaily();
  if(rolling)return;
  if(state.balance<COST){
    recover();
    return;
  }
  state.balance-=COST;
  state.stats.spent+=COST;
  state.daily.quests.spins=(state.daily.quests.spins||0)+1;
  state.stats.spins++;
  addXP(8);
  save();
  rolling=true;
  render();
  let ticks=0,total=18;
  const timer=setInterval(()=>{
    const area=document.getElementById('rolling');
    if(area){
      const tmp=generatePlate();
      area.innerHTML=fullPlateHTML(tmp);
    }
    ticks++;
    if(ticks>=total){
      clearInterval(timer);
      const p=generatePlate();
      state.last=p;
      state.stats.bestValue=Math.max(state.stats.bestValue,p.value);
      if(p.value===state.stats.bestValue){state.stats.bestText=p.text+' '+p.region;state.stats.bestRarity=p.rarity}
      if(p.rarity!=='Обычная'){
        state.stats.rare++;
        state.daily.quests.rare=(state.daily.quests.rare||0)+1;
        state.spinStreak++;
      }else{
        state.spinStreak=0;
      }
      if(!state.regions.includes(p.region))state.regions.push(p.region);
      if(state.spinStreak>=3){state.keys++;state.spinStreak=0;toast('Серия редких находок! +1 🔑')}
      addXP(p.rarity==='Уникальная'?45:p.rarity==='Легендарная'?32:p.rarity==='Эпическая'?20:p.rarity==='Редкая'?12:5);
      if(state.luckBoostSpins>0){state.luckBoostSpins--;if(state.luckBoostSpins===0)state.luckBoost=0;}
      save();
      rolling=false;
      render();
      toast('Номер выпал — выбирай действие');
    }
  },72+ticks*9);
}
function storeLast(){
  if(!state.last)return;
  if(state.plates.length>=state.storageMax){toast('Хранилище заполнено — расширь его');return}
  state.plates.unshift(state.last);state.last=null;addXP(4);save();render();toast('Номер сохранён 🗃️');
}
function sellLast(){
  if(!state.last)return;
  state.balance+=state.last.value;state.stats.sold++;state.stats.earned+=state.last.value;state.daily.quests.sell=(state.daily.quests.sell||0)+1;state.last=null;addXP(3);save();render();toast('Номер продан');
}
function sellPlate(id){
  const i=state.plates.findIndex(p=>p.id==id);if(i<0)return;
  const p=state.plates[i];state.balance+=p.value;state.stats.sold++;state.stats.earned+=p.value;state.daily.quests.sell=(state.daily.quests.sell||0)+1;state.plates.splice(i,1);save();render();toast('Продано за '+money(p.value));
}
function marketMultiplier(p){
  const hits=MARKET_ORDERS.filter(o=>o.match(p));
  return hits.length?Math.max(...hits.map(o=>o.mult)):1;
}
function marketPrice(p){return Math.round(p.value*marketMultiplier(p))}
function sellMarket(id){
  const i=state.plates.findIndex(p=>p.id==id);if(i<0)return;
  const p=state.plates[i], price=marketPrice(p);
  state.balance+=price;state.stats.sold++;state.stats.earned+=price;state.marketSold++;state.daily.quests.sell=(state.daily.quests.sell||0)+1;state.plates.splice(i,1);save();render();toast('Рынок выкупил номер за '+money(price));
}
function openBox(i){
  const b=BOXES[i];
  if(state.balance<b.price){toast('Не хватает '+money(b.price));return}
  if(state.cars.length>=state.garageMax){toast('Гараж заполнен — расширь его');return}
  state.balance-=b.price;state.stats.spent+=b.price;state.stats.opened++;
  const car=CARS[pick(b.ids)];
  state.cars.push({...car,id:Date.now()+Math.random()});
  addXP(b.rarity==='Эпическая'?30:b.rarity==='Редкая'?18:10);
  save();
  showModal(`<h2>${b.icon} ${b.name} контейнер</h2>
    <div class="car"><div class="tag">${esc(car.rarity)}</div><div class="carIcon">${car.icon}</div><h3>${esc(car.name)}</h3><div class="meta">${esc(car.className)} · новая машина</div><div class="price">${money(car.price)}</div></div>
    <div class="notice">Контейнер стоил ${money(b.price)}. Машина добавлена в гараж.</div>
    <button class="close" onclick="closeModal()">Забрать</button>`);
  render();
}
function claimDaily(){
  ensureDaily();
  if(state.daily.bonusClaimed){toast('Ежедневный бонус уже получен');return}
  state.balance+=15000;state.keys++;state.daily.bonusClaimed=true;addXP(10);save();render();toast('+15 000 ₽ и +1 🔑');
}
function claimAchievement(id){
  const a=ACH.find(x=>x.id===id);if(!a||state.achClaimed[id]||!a.check(state))return;
  state.achClaimed[id]=true;
  if(a.reward.includes('🔑'))state.keys+=(a.reward.match(/(\d+)/)||[0,1])[1]*1;
  if(a.reward.includes('₽'))state.balance+=parseInt(a.reward.replace(/\D/g,''),10);
  save();render();toast('Достижение получено 🏆');
}
function recover(){
  ensureDaily();
  if(state.balance>=COST){return}
  if(state.recoveryDate===today()){toast('Бонус восстановления уже использован сегодня');return}
  state.balance+=25000;state.recoveryDate=today();save();render();toast('Бонус восстановления: +25 000 ₽');
}
function buyLuck(){
  const costs=[180000,450000,900000,1700000];
  if(state.luck>=5){toast('Удача уже максимальная');return}
  const price=costs[state.luck-1];
  if(state.balance<price){toast('Не хватает денег');return}
  state.balance-=price;state.stats.spent+=price;state.luck++;state.upgrade.luck++;save();render();toast('Удача повышена 🍀');
}
function buyStorage(){
  const price=50000*(state.upgrade.storage+1);
  if(state.balance<price){toast('Не хватает денег');return}
  state.balance-=price;state.stats.spent+=price;state.storageMax+=10;state.upgrade.storage++;save();render();toast('Хранилище расширено');
}
function buyGarage(){
  const price=100000*(state.upgrade.garage+1);
  if(state.balance<price){toast('Не хватает денег');return}
  state.balance-=price;state.stats.spent+=price;state.garageMax+=3;state.upgrade.garage++;save();render();toast('Гараж расширен');
}
function resetGame(){
  if(!confirm('Сбросить весь прогресс и начать с 500 000 ₽?'))return;
  localStorage.removeItem('nomerok_ultra_v2');location.reload();
}
function showModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function setTop(v){activeTop=v;state.top=v;document.getElementById('platesTab').classList.toggle('active',v==='plates');document.getElementById('carsTab').classList.toggle('active',v==='cars');render()}
function setPage(v){page=v;state.page=v;save();render();window.scrollTo(0,0)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1700)}
function eventText(){return '🔥 Событие недели: «Охота за красивыми номерами» — комбинации 777, 123, 321 и одинаковые буквы продаются на рынке с повышенным спросом.'}

  const p=state.last;
  return `<div class="event"><div class="eventIcon">🔥</div><div><b>Охота за красивыми номерами</b><span>${eventText()}</span></div></div>

    <div class="titleRow"><b>Последний результат</b><span>${state.stats.spins} прокруток · 🍀 ${state.luckBoostSpins>0?`+${state.luckBoost} ×${state.luckBoostSpins}`:'обычная'}</span></div>
    <div id="rolling">${p?fullPlateHTML(p):'<div class="empty"><b>Готов к новой находке</b>Весь номерной пул общий. Комбинация и редкость определяются после выпадения.</div>'}</div>
    ${p?`<div class="actions"><button class="btn green" onclick="storeLast()">🗃️ В хранилище</button><button class="btn red" onclick="sellLast()">💰 Продать</button></div>`:''}
    <div class="spinWrap"><div class="cost">Одна прокрутка — <b>5 000 ₽</b> · Баланс: <b>${money(state.balance)}</b></div>
      <button class="spin" id="spinBtn" onclick="spin()" ${state.balance<COST||rolling?'disabled':''}>${state.balance<COST?'Недостаточно средств':rolling?'Прокрутка…':'Крутить за 5 000 ₽'}</button>
      <div class="smallNote">Виртуальная валюта игры. При нехватке средств один раз в день доступен бонус восстановления.</div>
    </div>
  </div>
  <div class="card"><div class="titleRow"><b>Как определяется ценность номера</b><span>после выпадения</span></div>

  </div>
  <div class="card"><div class="titleRow"><b>Экономика</b><span>риск ↔ награда</span></div>
    <div class="infoGrid">
      <div class="info"><b>Обычный</b><span>примерно 700–5 000 ₽</span></div>
      <div class="info"><b>Редкий</b><span>примерно 3 500–50 000 ₽</span></div>
      <div class="info"><b>Эпический</b><span>примерно 18 000–250 000 ₽</span></div>
      <div class="info"><b>Легендарный+</b><span>90 000–1 000 000+ ₽</span></div>
    </div>
    <div class="notice">Средняя находка не должна бесконечно поддерживать баланс: большинство прокруток — расход, а редкие красивые номера дают шанс резко выйти в плюс. Деньги также можно потратить на улучшения, рынок и контейнеры.</div>

  <div class="card"><div class="titleRow"><b>Ежедневный бонус</b><span>${state.daily.bonusClaimed?'получен':'доступен'}</span></div>
    <div class="quest"><div class="qicon">🎁</div><div><b>15 000 ₽ + 1 🔑</b><span>Стабильный небольшой доход для продолжения коллекции</span></div><button class="btn ${state.daily.bonusClaimed?'':'green'}" style="padding:8px 10px" onclick="claimDaily()" ${state.daily.bonusClaimed?'disabled':''}>${state.daily.bonusClaimed?'✓':'Забрать'}</button></div>
  </div>`;

function storeView(){
  const list=[...state.plates];
  return `<div class="card"><div class="titleRow"><b>Мои номера</b><span>${state.plates.length}/${state.storageMax}</span></div>
  ${list.length?list.map(p=>`<div class="card" style="margin-top:8px;padding:11px">${plateHTML(p)}${plateInfoHTML(p)}<div class="actions"><button class="btn blue" onclick="sellMarket(${p.id})">🏪 Рынок · ${money(marketPrice(p))}</button><button class="btn red" onclick="sellPlate(${p.id})">💰 Продать · ${money(p.value)}</button></div></div>`).join(''):'<div class="empty"><b>Хранилище пусто</b>Сохраняй понравившиеся номера после выпадения.</div>'}</div>
  <div class="card"><div class="titleRow"><b>Альбом регионов</b><span>${state.regions.length}/${REGIONS.length}</span></div><div class="album">${REGIONS.map(r=>`<div class="regionTile ${state.regions.includes(r[0])?'done':''}"><div class="r">${r[0]}</div>${state.regions.includes(r[0])?'✓':'?'}</div>`).join('')}</div></div>`;
}
function marketView(){
  const target=MARKET_ORDERS;
  return `<div class="card"><div class="titleRow"><b>Рынок</b><span>${state.marketSold} продаж</span></div>
  <div class="notice">Здесь покупатели-NPC меняют спрос. Совпавший с их запросом номер получает повышенную цену. Каждый день спрос обновляется.</div>
  ${target.map(o=>`<div class="offer"><div class="offerTop"><div><b>${esc(o.name)}</b><small>${esc(o.desc)}</small></div><span class="badge">×${o.mult.toFixed(2)}</span></div><div class="offerPrice">Бонус к цене подходящих номеров</div></div>`).join('')}
  <div class="titleRow" style="margin-top:15px"><b>Твои номера для рынка</b><span>${state.plates.length}</span></div>
  ${state.plates.length?state.plates.slice(0,8).map(p=>`<div class="offer"><div class="marketPlate"><div class="marketMini">${plateHTML(p,true)}</div><div><b>${esc(p.letters?.[0]||'А')} ${esc((p.digits||[]).join(''))} ${esc((p.letters||[]).slice(1).join(''))} · ${esc(p.region)}</b><small>${esc(p.rarity)} · базовая ${money(p.value)}</small><div class="offerPrice">${marketMultiplier(p)>1?'🔥 ':''}${money(marketPrice(p))}</div></div></div><button class="offerBtn" onclick="sellMarket(${p.id})">${marketMultiplier(p)>1?'Продать по спросу':'Продать NPC'} · ${money(marketPrice(p))}</button></div>`).join(''):'<div class="empty"><b>Пока нечего продавать</b>Сначала собери несколько номеров.</div>'}
  </div>`;
}
function boxesView(){
  return `<div class="card"><div class="titleRow"><b>Контейнеры</b><span>${state.balance.toLocaleString('ru-RU')} ₽</span></div>
  <div class="notice">Три уровня контейнеров. Цена растёт вместе с классом машин. Открытие расходует только виртуальные рубли из баланса игры.</div>
  <div class="grid" style="margin-top:8px">${BOXES.map((b,i)=>`<div class="container ${b.cls}"><div class="boxIcon">${b.icon}</div><h3>${b.name}</h3><div class="desc">${b.tag} · машины до класса ${i===0?'Street':i===1?'Sport':'Supercar'}</div><div class="cprice">${money(b.price)}</div><button class="open" onclick="openBox(${i})" ${state.balance<b.price||state.cars.length>=state.garageMax?'disabled':''}>${state.balance<b.price?'Не хватает денег':state.cars.length>=state.garageMax?'Нет места':'Открыть за '+money(b.price)}</button></div>`).join('')}</div>
  </div>
  <div class="card"><div class="titleRow"><b>Вероятности классов</b><span>игровые значения</span></div>
    <div class="stat"><b>Гаражный</b><span>обычные автомобили</span></div>
    <div class="stat"><b>Спортивный</b><span>редкие + эпические</span></div>
    <div class="stat"><b>Премиум</b><span>эпические + легендарные + уникальные</span></div>
  </div>`;
}
function garageView(){
  return `<div class="card"><div class="titleRow"><b>Гараж</b><span>${state.cars.length}/${state.garageMax}</span></div>
  ${state.cars.length?`<div class="grid">${state.cars.map(c=>`<div class="car"><div class="tag">${esc(c.rarity)}</div><div class="carIcon">${c.icon}</div><h3>${esc(c.name)}</h3><div class="meta">${esc(c.className)} · коллекционная</div><div class="price">${money(c.price)}</div></div>`).join('')}</div>`:'<div class="empty"><b>Гараж пуст</b>Открывай контейнеры, чтобы добавлять машины.</div>'}</div>
  <div class="card"><div class="titleRow"><b>Бонус комплектов</b><span>номер + машина</span></div>
    <div class="notice">Полноценные комплекты будут давать дополнительную ценность коллекции. Сейчас система отслеживает сам факт наличия редкого номера и машины.</div>
    <div class="infoGrid"><div class="info"><b>Машин собрано</b><span>${state.cars.length}/${CARS.length*2} мест коллекции</span></div><div class="info"><b>Уникальных моделей</b><span>${new Set(state.cars.map(c=>c.name)).size}</span></div></div>
  </div>
  <div class="card"><div class="titleRow"><b>Коллекция машин</b><span>${CARS.length} моделей</span></div><div class="grid">${CARS.map(c=>`<div class="smallCard"><div style="font-size:30px">${c.icon}</div><h3>${esc(c.name)}</h3><p>${esc(c.rarity)} · ${money(c.price)}</p></div>`).join('')}</div></div>`;
}
function profileView(){
  const value=state.plates.reduce((a,p)=>a+p.value,0)+state.cars.reduce((a,c)=>a+c.price,0);
  const luckCost=state.luck<5?[180000,450000,900000,1700000][state.luck-1]:0;
  return `<div class="card"><div class="titleRow"><b>Профиль коллекционера</b><span>Сезон 1</span></div>
    <div class="stat"><b>Уровень</b><span>${state.level}</span></div>
    <div class="stat"><b>Опыт</b><span>${state.xp}/100 XP</span></div>
    <div class="stat"><b>Прокруток</b><span>${state.stats.spins}</span></div>
    <div class="stat"><b>Потрачено</b><span>${money(state.stats.spent)}</span></div>
    <div class="stat"><b>Заработано</b><span>${money(state.stats.earned)}</span></div>
    <div class="stat"><b>Продано номеров</b><span>${state.stats.sold}</span></div>
    <div class="stat"><b>Лучший номер</b><span>${esc(state.stats.bestText)} · ${money(state.stats.bestValue)}</span></div>
    <div class="stat"><b>Коллекция</b><span>${money(value)}</span></div>
  </div>
  <div class="card"><div class="titleRow"><b>Улучшения</b><span>используй баланс</span></div>
    <div class="upgrade"><div class="upgradeTop"><h3>🍀 Удача ${state.luck}/5</h3><span>${state.luck>=5?'MAX':money(luckCost)}</span></div><p>Немного повышает шансы на редкие результаты. Это постоянное игровое улучшение.</p><button onclick="buyLuck()" ${state.luck>=5||state.balance<luckCost?'disabled':''}>${state.luck>=5?'Максимум':'Повысить удачу'}</button></div>
    <div class="upgrade"><div class="upgradeTop"><h3>🗃️ Хранилище +10</h3><span>${money(50000*(state.upgrade.storage+1))}</span></div><p>Больше места для коллекции, чтобы не продавать интересные номера сразу.</p><button onclick="buyStorage()" ${state.balance<50000*(state.upgrade.storage+1)?'disabled':''}>Расширить</button></div>
    <div class="upgrade"><div class="upgradeTop"><h3>🚘 Гараж +3</h3><span>${money(100000*(state.upgrade.garage+1))}</span></div><p>Дополнительные места для автомобилей.</p><button onclick="buyGarage()" ${state.balance<100000*(state.upgrade.garage+1)?'disabled':''}>Расширить</button></div>
  </div>
  <div class="card"><div class="titleRow"><b>Достижения</b><span>${Object.keys(state.achClaimed).length}/${ACH.length}</span></div>
    ${ACH.map(a=>{const done=!!state.achClaimed[a.id],ok=a.check(state);return `<div class="quest"><div class="qicon">${a.icon}</div><div><b>${esc(a.title)}</b><span>${esc(a.desc)} · награда ${esc(a.reward)}</span></div><button class="btn ${ok&&!done?'gold':''}" style="padding:7px 9px" onclick="claimAchievement('${a.id}')" ${done||!ok?'disabled':''}>${done?'✓':ok?'Забрать':'-'}</button></div>`}).join('')}
  </div>
  <div class="card"><div class="titleRow"><b>Управление</b><span>прототип</span></div>
    <button class="btn red" style="width:100%" onclick="resetGame()">Сбросить прогресс</button>
  </div>`;
}
function render(){
  ensureDaily();
  document.getElementById('balance').textContent=money(state.balance);
  document.getElementById('level').textContent=state.level;
  document.getElementById('luck').textContent=state.luck;
  document.getElementById('keys').textContent=state.keys;
  document.getElementById('xpbar').style.width=state.xp+'%';
  document.getElementById('platesTab').classList.toggle('active',activeTop==='plates');
  document.getElementById('carsTab').classList.toggle('active',activeTop==='cars');
  ['spin','store','market','boxes','garage'].forEach(v=>{const el=document.getElementById('nav'+v[0].toUpperCase()+v.slice(1));if(el)el.classList.toggle('active',page===v)});
  const main=document.getElementById('main');
  if(page==='profile')main.innerHTML=profileView();
  else if(activeTop==='cars' && page==='spin')main.innerHTML=garageView();
  else if(page==='spin')main.innerHTML=spinView();
  else if(page==='store')main.innerHTML=storeView();
  else if(page==='market')main.innerHTML=marketView();
  else if(page==='boxes')main.innerHTML=boxesView();
  else if(page==='garage')main.innerHTML=garageView();
  else main.innerHTML=spinView();
}

window.addEventListener('error',e=>{
  console.error('Номерок error:',e.error||e.message);
  const m=document.getElementById('main');
  if(m && !m.dataset.rendered) m.innerHTML='<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:42px">⚠️</div><h2>Номерок</h2><div style="color:#999">Игра не смогла загрузиться. Обнови страницу.</div></div>';
});
function bootGame(){
  try{
    ensureDaily();
    render();
  }catch(err){
    console.error('Номерок boot error:',err);
    try{
      localStorage.removeItem('nomerok_ultra_v2');
      state=JSON.parse(JSON.stringify(defaults));
      state.stats=JSON.parse(JSON.stringify(defaults.stats));
      state.daily=JSON.parse(JSON.stringify(defaults.daily));
      state.upgrade=JSON.parse(JSON.stringify(defaults.upgrade));
      page='spin'; activeTop='plates';
      render();
      toast('Прогресс повреждён — игра восстановлена');
    }catch(err2){
      console.error('Номерок recovery error:',err2);
      const main=document.getElementById('main');
      if(main) main.innerHTML='<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:42px">⚠️</div><h2>Ошибка загрузки</h2><div style="color:#999;line-height:1.5">Обнови страницу. Если экран снова будет белым, очисти данные сайта GitHub Pages.</div></div>';
    }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootGame,{once:true});
else bootGame();
</script>
</body>
</html>
